<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Онлайн-запись на консультацию психолога в центре «Гармония». Выберите специалиста, удобную дату и время. Анонимно, безопасно. Записаться можно за 2 минуты.">

    <link href="main.css" rel="stylesheet" type="text/css">

       (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
       m[i].l=1*new Date();
       for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
       k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})

</head>
<body>
    <div class="container">
        <!-- Сайдбар подгружается из sidebar.js -->
        <div id="sidebar"></div>

        <main class="content">
            <section id="home">
                <h1>Запись на прием</h1>
                <h3>Выберите психолога и запишитесь на консультацию</h3>

                <p>В нашем центре работают опытные специалисты. Вы можете выбрать психолога, дату и удобное время для консультации.</p>

                <section id="appointment">
                    <h2>Заполните форму</h2>
                    
                    <!-- Убрали action и method, добавили id для JS -->
                    <form id="appointmentForm">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" required>

                        <label for="phone">Телефон:</label>
                        <input type="tel" id="phone" name="phone" required>

                        <label for="specialist">Выберите специалиста:</label>
                        <select id="specialist" name="specialist" required>
                            <option value="">-- Выберите психолога --</option>
                            <option value="michael">Михаил Новиков</option>
                            <option value="vasia">Василий Пронин</option>
                            <option value="dima">Дмитрий Демидов</option>
                            <option value="maks">Максим Леонтьев</option>
                        </select>

                        <label for="date">Выберите дату:</label>
                        <input type="date" id="date" name="date" required>

                        <button type="submit">Записаться на прием</button>
                    </form>
                </section>
            </section>
        </main>
    </div>

    <!-- Подключаем скрипт сайдбара -->
    <script src="sidebar.js" defer></script>

    <!-- Скрипт обработки формы и отправки цели в Метрику -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Устанавливаем минимальную дату — сегодня
            const dateInput = document.getElementById('date');
            if(dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.min = today;
            }

            // Обработка отправки формы
            const form = document.getElementById('appointmentForm');
            if(form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault(); // Отменяем перезагрузку и ошибку 405

                    // Собираем данные
                    const name = document.getElementById('name').value;
                    const phone = document.getElementById('phone').value;
                    const specialist = document.getElementById('specialist').value;
                    const date = document.getElementById('date').value;

                    // Сохраняем в LocalStorage
                    const appointment = { name, phone, specialist, date, timestamp: new Date().toISOString() };
                    let appointments = JSON.parse(localStorage.getItem('appointments')) || [];
                    appointments.push(appointment);
                    localStorage.setItem('appointments', JSON.stringify(appointments));

                    // Отправляем цель в Яндекс.Метрику
                    if (typeof ym !== 'undefined') {
                        ym(114414632, 'reachGoal', 'form_submit');
                    }

                    // Показываем сообщение пользователю
                    alert('Спасибо, ' + name + '! Вы записаны на ' + date + '. Мы свяжемся с вами по номеру ' + phone);
                    
                    // Очищаем форму
                    this.reset(); 
                });
            }
        });
    </script>
</body>
</html>
